# ===== App =====
spring.application.name=cornerpub
server.port=8080

# ===== DB (override con variabili d'ambiente in produzione) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/corner}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:corner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:corner}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# ===== Hikari =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=0
spring.flyway.baseline-on-migrate=true

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== Timezone / JSON =====
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Error/Actuator =====
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# ===== Upload (disco locale, niente Cloudinary) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
app.upload.public-path=/uploads

# ===== Mail (Gmail) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.from.noreply=${MAIL_FROM:${MAIL_USERNAME:}}
mail.to.admin=${MAIL_TO_ADMIN:${MAIL_USERNAME:}}
mail.enabled=true
mail.rate-ms=1500

# ===== Logging =====
logging.level.root=INFO
logging.level.com.cornerpub=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level [%thread] %logger{36} - %msg%n

# ===== Privacy =====
privacy.policy.version=v1.0
