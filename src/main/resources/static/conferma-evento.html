<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Conferma partecipazione · Corner Pub</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preload" href="fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/corner.css?v=2">
  <style>
    .confirm-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(40rem 24rem at 50% -10%, rgba(212, 175, 55, 0.14), transparent 60%),
        var(--bg);
    }
    .confirm-card {
      width: min(440px, 100%);
      padding: 1.75rem 1.5rem 1.85rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .confirm-card .brand {
      display: inline-block;
      margin-bottom: 1.25rem;
      font-size: 1.35rem;
    }
    .confirm-card h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.45rem, 5vw, 1.85rem);
    }
    .confirm-card .meta {
      margin: 0 0 0.45rem;
      color: var(--muted);
    }
    .confirm-card .title {
      margin: 0 0 1.35rem;
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--text);
    }
    .confirm-actions {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
    }
    .confirm-msg {
      margin: 1.1rem 0 0;
      font-weight: 600;
    }
    .confirm-msg.is-ok { color: var(--success, #7dce8a); }
    .confirm-msg.is-err { color: var(--danger); }
  </style>
</head>
<body>
  <main class="confirm-page">
    <div class="confirm-card">
      <a class="brand" href="/">Corner <em>Pub</em></a>
      <h1>Confermi la partecipazione?</h1>
      <p class="meta" id="hello"></p>
      <p class="title" id="event"></p>
      <p class="meta" id="when"></p>
      <div class="confirm-actions" id="actions" hidden>
        <button class="btn btn-gold" type="button" id="btnYes">Sì, ci sarò</button>
        <button class="btn btn-ghost" type="button" id="btnNo">No</button>
      </div>
      <p class="confirm-msg" id="msg"></p>
    </div>
  </main>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const hello = document.getElementById('hello');
const eventEl = document.getElementById('event');
const when = document.getElementById('when');
const actions = document.getElementById('actions');
const msg = document.getElementById('msg');

function showStatus(attending) {
  if (attending === true) {
    msg.className = 'confirm-msg is-ok';
    msg.textContent = 'Perfetto, ti aspettiamo.';
  } else if (attending === false) {
    msg.className = 'confirm-msg is-err';
    msg.textContent = 'Ok, abbiamo registrato che non parteciperai.';
  }
}

async function load() {
  if (!token) {
    msg.className = 'confirm-msg is-err';
    msg.textContent = 'Link non valido.';
    return;
  }
  const res = await fetch('/api/events/attendance?token=' + encodeURIComponent(token));
  const data = await res.json();
  if (!res.ok) {
    msg.className = 'confirm-msg is-err';
    msg.textContent = data.error || 'Link non valido.';
    return;
  }
  hello.textContent = data.name ? ('Ciao ' + data.name) : 'Ciao';
  eventEl.textContent = data.eventTitle || 'Evento';
  when.textContent = data.eventDate || '';
  actions.hidden = false;
  showStatus(data.attending);
}

async function choose(attending) {
  const res = await fetch('/api/events/attendance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, attending })
  });
  const data = await res.json();
  if (!res.ok) {
    msg.className = 'confirm-msg is-err';
    msg.textContent = data.error || 'Non è stato possibile salvare la risposta.';
    return;
  }
  showStatus(data.attending);
}

document.getElementById('btnYes').onclick = () => choose(true);
document.getElementById('btnNo').onclick = () => choose(false);
load();
</script>
</body>
</html>
