<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferma partecipazione · Corner Pub</title>
    <style>
        :root { --gold: #e8c547; --cream: #f6f4ef; --ink: #1a1a1a; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: var(--cream);
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
        }
        .card {
            width: min(440px, calc(100% - 32px));
            margin: 24px auto;
            background: #fff7ea;
            border: 1px solid rgba(180, 140, 40, 0.22);
            border-radius: 1.25rem;
            box-shadow: 0 18px 40px rgba(0,0,0,.08);
            overflow: hidden;
        }
        header {
            background: #fff;
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(180, 140, 40, 0.18);
            text-align: center;
        }
        header p { margin: 0 0 6px; color: #8a6d1d; letter-spacing: .14em; text-transform: uppercase; font-size: .75rem; font-weight: 800; }
        header h1 { margin: 0; font-size: 1.45rem; }
        .body { padding: 22px 24px 28px; text-align: center; }
        .meta { color: #5a5348; margin: 0 0 8px; }
        .title { margin: 0 0 18px; font-size: 1.2rem; }
        .actions { display: flex; gap: 12px; }
        button {
            flex: 1;
            border: 0;
            border-radius: 0.9rem;
            padding: 16px 10px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
        }
        .yes { background: var(--gold); color: #111; }
        .no { background: #fff; color: #111; border: 1px solid rgba(180, 140, 40, 0.35); }
        .msg { margin-top: 16px; font-weight: 700; }
        .err { color: #9b1c1c; }
        .ok { color: #1d6b32; }
    </style>
</head>
<body>
<div class="card">
    <header>
        <p>Corner Pub</p>
        <h1>Confermi la partecipazione?</h1>
    </header>
    <div class="body">
        <p class="meta" id="hello"></p>
        <p class="title" id="event"></p>
        <p class="meta" id="when"></p>
        <div class="actions" id="actions" hidden>
            <button class="yes" type="button" id="btnYes">Sì, ci sarò</button>
            <button class="no" type="button" id="btnNo">No</button>
        </div>
        <p class="msg" id="msg"></p>
    </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const hello = document.getElementById('hello');
const eventEl = document.getElementById('event');
const when = document.getElementById('when');
const actions = document.getElementById('actions');
const msg = document.getElementById('msg');

function showStatus(attending) {
    if (attending === true) {
        msg.className = 'msg ok';
        msg.textContent = 'Perfetto, ti aspettiamo.';
    } else if (attending === false) {
        msg.className = 'msg err';
        msg.textContent = 'Ok, abbiamo registrato che non parteciperai.';
    }
}

async function load() {
    if (!token) {
        msg.className = 'msg err';
        msg.textContent = 'Link non valido.';
        return;
    }
    const res = await fetch('/api/events/attendance?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = data.error || 'Link non valido.';
        return;
    }
    hello.textContent = data.name ? ('Ciao ' + data.name) : 'Ciao';
    eventEl.textContent = data.eventTitle || 'Evento';
    when.textContent = data.eventDate || '';
    actions.hidden = false;
    showStatus(data.attending);
}

async function choose(attending) {
    const res = await fetch('/api/events/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, attending })
    });
    const data = await res.json();
    if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = data.error || 'Non è stato possibile salvare la risposta.';
        return;
    }
    showStatus(data.attending);
}

document.getElementById('btnYes').onclick = () => choose(true);
document.getElementById('btnNo').onclick = () => choose(false);
load();
</script>
</body>
</html>
